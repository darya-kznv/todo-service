services:
  swagger:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.24.1-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - .:/code

  todoservice:
    build:
      context: .
      dockerfile: cmd/todoservice/Dockerfile
    container_name: todoservice
    env_file:
      - ./.env
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_HOST=todoservice-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - REDIS_HOST=todoapp-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
      - TIME_ZONE=${TIME_ZONE}
    volumes:
      - ./out/logs:/app/out/logs
    ports:
      - "5050:5050"
    depends_on:
      todoservice-postgres:
        condition: service_healthy
    restart: always

  todoservice-postgres:
    image: postgres:18.1-bookworm
    container_name: todoservice-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  todoapp-redis:
    image: redis:8.6.1
    container_name: todoapp-env-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - ./out/redis_data:/data
    restart: always

  todoservice-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations
    depends_on:
      todoservice-postgres:
        condition: service_healthy

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoservice-port-forwarder
    entrypoint: ["/bin/sh", "-c"]
    command: "socat tcp-listen:5432,fork,reuseaddr tcp-connect:todoservice-postgres:5432 & exec socat tcp-listen:6379,fork,reuseaddr tcp-connect:todoapp-redis:6379"
    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6379:6379"
